<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">Sleepee Operating Flow</title><desc id="desc">سير العمل من البيانات الأساسية إلى المصنع والطباعة والضمان وخدمة العملاء</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#62788D"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16344D" flood-opacity=".10"/></filter></defs><rect width="1600" height="1120" fill="#F4F8FB"/><rect x="55" y="40" width="1490" height="1040" rx="28" fill="#FFFFFF" stroke="#DAE4EC" stroke-width="2"/><text x="800" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#16344D">SLEEPEE • OPERATING FLOW</text><text x="800" y="139" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#657A8E">Traceable events with guarded transitions and no assumed factory data</text>
<!-- top manufacturing flow -->
<rect x="110" y="205" width="260" height="110" rx="16" fill="#E7F0FC" stroke="#A8C3E5" stroke-width="2" filter="url(#sh)"/><text x="240" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#244E81">1 · MASTER DATA</text><text x="240" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#244E81">Category · Brand · Model</text><text x="240" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#244E81">Approved dimensions only</text>
<rect x="450" y="205" width="260" height="110" rx="16" fill="#E7F6F1" stroke="#99D1C1" stroke-width="2" filter="url(#sh)"/><text x="580" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#1F6758">2 · PRODUCTION ORDER</text><text x="580" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#1F6758">Order lines · model · quantity</text><text x="580" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1F6758">Draft → approved workflow</text>
<rect x="790" y="205" width="260" height="110" rx="16" fill="#FFF2D9" stroke="#E7CC8E" stroke-width="2" filter="url(#sh)"/><text x="920" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#83571B">3 · BATCH</text><text x="920" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#83571B">Linked to a real order</text><text x="920" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#83571B">No made-up quantity</text>
<rect x="1130" y="205" width="320" height="110" rx="16" fill="#EEE9FA" stroke="#C0B0E4" stroke-width="2" filter="url(#sh)"/><text x="1290" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#5D4788">4 · SERIALIZATION RPC</text><text x="1290" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5D4788">Checks quantity + single model</text><text x="1290" y="299" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5D4788">Serial identity is immutable</text>
<path d="M370 260 H450 M710 260 H790 M1050 260 H1130" stroke="#62788D" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<!-- label & print -->
<rect x="170" y="415" width="350" height="125" rx="18" fill="#E4F0FF" stroke="#9CBFE8" stroke-width="2" filter="url(#sh)"/><text x="345" y="459" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#254F83">5 · LABEL TEMPLATE</text><text x="345" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#254F83">Active + published + category match</text><text x="345" y="515" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#254F83">100×50 · 100×80 · 100×100 · custom</text>
<rect x="625" y="415" width="350" height="125" rx="18" fill="#F1E9FB" stroke="#C3ADE6" stroke-width="2" filter="url(#sh)"/><text x="800" y="459" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#5D4283">6 · PRINT JOB</text><text x="800" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5D4283">Snapshot captures selected template</text><text x="800" y="515" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5D4283">No implicit default template</text>
<rect x="1080" y="395" width="330" height="165" rx="18" fill="#FDE9E7" stroke="#E0A6A0" stroke-width="2" filter="url(#sh)"/><text x="1245" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#8A312B">7 · HARDWARE GATE</text><text x="1245" y="467" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#8A312B">Zebra ZD220</text><text x="1245" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#8A312B">Current candidate: BLOCKED</text><text x="1245" y="523" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#8A312B">No Printed status / fake history</text>
<path d="M1290 315 V365 H345 V415 M520 478 H625 M975 478 H1080" stroke="#62788D" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="1130" y="600" width="230" height="52" rx="14" fill="#F8DCDD" stroke="#D98787" stroke-width="2"/><text x="1245" y="633" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#8A2D2D">FAIL CLOSED</text><path d="M1245 560 V600" stroke="#B94B4B" stroke-width="3" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)"/>
<!-- service / warranty -->
<rect x="170" y="700" width="350" height="125" rx="18" fill="#E5F6ED" stroke="#9BCFB2" stroke-width="2" filter="url(#sh)"/><text x="345" y="745" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#245D3C">8 · WARRANTY ACTIVATION</text><text x="345" y="776" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#245D3C">After sale / invoice · authorized RPC</text><text x="345" y="801" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#245D3C">Duration + end date snapshot frozen</text>
<rect x="625" y="700" width="350" height="125" rx="18" fill="#E8F2FD" stroke="#A3C0E1" stroke-width="2" filter="url(#sh)"/><text x="800" y="745" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#244D7C">9 · CUSTOMER SERVICE</text><text x="800" y="776" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#244D7C">Case + notes + private attachments</text><text x="800" y="801" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#244D7C">Role and RLS protected</text>
<rect x="1080" y="700" width="330" height="125" rx="18" fill="#FFF2D9" stroke="#E4CA89" stroke-width="2" filter="url(#sh)"/><text x="1245" y="745" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#80551B">10 · REPLACEMENT</text><text x="1245" y="776" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#80551B">Linked to real case + serial UUID</text><text x="1245" y="801" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#80551B">Final roles/states need owner approval</text>
<path d="M520 762 H625 M975 762 H1080" stroke="#62788D" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<text x="800" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#657A8E">Warranty activation follows a real sale/invoice; it is not caused by choosing a label template.</text>
<rect x="170" y="895" width="1240" height="105" rx="18" fill="#F2F5F7" stroke="#B9C7D2" stroke-width="2"/><text x="790" y="933" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#3E566B">CROSS-CUTTING CONTROLS</text><text x="790" y="964" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#3E566B">Canonical roles · RLS · security-definer RPC review · immutable warranty snapshot · append-only audit/history</text><text x="790" y="988" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#3E566B">No historical destructive SQL · no seeded production data · no claimed physical print success</text>
</svg>